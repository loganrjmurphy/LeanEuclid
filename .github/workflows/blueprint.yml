on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build and test
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and Install CVC5
        run: |
          git clone https://github.com/cvc5/cvc5
          cd cvc5
          ./configure.sh --auto-download
          cd build
          make -j$(nproc)
          sudo make install

      - name: Build and Install Z3
        run: |
          git clone https://github.com/Z3Prover/z3
          cd z3
          python3 scripts/mk_make.py
          cd build
          make -j$(nproc)
          sudo make install

      - name: Install Python and smt-portfolio
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Get cache
        run: ~/.elan/bin/lake exe cache get

      - name: Build project
        run: |
          ~/.elan/bin/lake script run check
          ~/.elan/bin/lake build SystemE Book UniGeo E3
          python -m unittest discover -s tests -v
          python -m tests.smoke
          python -m tests.examples
  
      - name: Cache mathlib docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            .lake/build/doc/Init
            .lake/build/doc/Lake
            .lake/build/doc/Lean
            .lake/build/doc/Std
            .lake/build/doc/Mathlib
            .lake/build/doc/declarations
            !.lake/build/doc/declarations/declaration-data-Book*
          key: MathlibDoc-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            MathlibDoc-

      - name: Build documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: ~/.elan/bin/lake -R -Kenv=dev build Book:docs

      #- name: Build blueprint and copy to `docs/blueprint`
      #  uses: xu-cheng/texlive-action@v2
      #  with:
      #    docker_image: ghcr.io/xu-cheng/texlive-full:20231201
      #    run: |
      #      apk update
      #      apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
      #      git config --global --add safe.directory $GITHUB_WORKSPACE
      #      git config --global --add safe.directory `pwd`
      #      python3 -m venv env
      #      source env/bin/activate
      #      pip install --upgrade pip requests wheel
      #      pip install pygraphviz --global-option=build_ext --global-option="-L/usr/lib/graphviz/" --global-option="-R/usr/lib/graphviz/"
      #      pip install leanblueprint
      #      leanblueprint pdf
      #      mkdir docs
      #      cp blueprint/print/print.pdf docs/blueprint.pdf
      #      leanblueprint web
      #      cp -r blueprint/web docs/blueprint

      # - name: Check declarations
      #  run: |
      #      ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

      - name: Move documentation to `docs/docs`
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p docs
          cp -r .lake/build/doc docs/docs

      - name: Upload docs & blueprint artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build_project
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
